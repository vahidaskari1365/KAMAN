# پیکربندی nginx برای نرم‌افزار بایگانی
# کپی کنید به /etc/nginx/sites-available/kaman و دامنه/پورت را تنظیم کنید
# سپس: sudo ln -s /etc/nginx/sites-available/kaman /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx

# اگر دامنه دارید server_name را تنظیم کنید، وگرنه IP سرور را بگذارید.

# هدرهای امنیتی و proxy به سمت Next.js روی پورت 3000
server {
    listen 80;
    listen [::]:80;
    server_name _;  # دامنه خود را جایگزین کنید، مثلاً archive.example.com

    # حجم حداکثر برای آپلود فایل‌های اسکن شده (مثلاً ۵۰ مگابایت)
    client_max_body_size 50M;

    # فشرده‌سازی
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        # timeout بالاتر برای آپلود فایل‌های بزرگ
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # کش کردن asset های Next.js
    location /_next/static/ {
        alias /opt/kaman/app/.next/static/;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location /favicon.ico {
        alias /opt/kaman/app/public/favicon.ico;
        expires 30d;
    }
}

# برای فعال‌سازی HTTPS (پیشنهادی):
#   sudo apt-get install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d archive.example.com
# certbot خودکار nginx را برای HTTPS پیکربندی می‌کند.
